[project]
name = "cerl-bench"
version = "0.1.0"
description = "Counterfactual Enterprise Reinforcement Learning for Safe Tool-Using Agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Only needed for live model evaluation, which additionally requires an
# explicitly authorised spending budget. See cerl.agents.model_client.
live = ["anthropic>=0.40"]

[project.scripts]
cerl = "cerl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "model: needs the RL pilot's model weights and torch; opt in with -m model in .venv-rl",
]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/cerl"]
branch = true

[tool.mypy]
python_version = "3.11"
strict = true
# The Phase-2 RL pilot is deliberately outside the benchmark's gates. It needs
# torch/peft/trl, which are NOT part of the ordinary install by design, so type
# checking it here would make `mypy --strict src` fail on a clean checkout and
# would drag a training dependency into offline CI. It lives in its own venv
# (.venv-rl) and its own test marker; see LOCAL_RL_PILOT_REPORT.md.
exclude = ["^src/cerl_rl/"]
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional live-evaluation dependency; not installed by default because live
# runs additionally require an authorised spending budget.
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstring style; we use prose docstrings, not a fixed convention
    "ANN401",  # Any is needed for pydantic core-schema hooks
    "COM812",  # conflicts with formatter
    "ISC001",  # conflicts with formatter
    "TD", "FIX",
    "S101",    # assert is fine in this codebase's invariant checks
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # verifier/env fan-out is inherent
    "C901",
    "EM101", "EM102", "TRY003",  # inline exception messages are clearer here
    "N818",    # our error names are domain nouns, not *Error
    "CPY001",  # licensing lives in LICENSE, not in per-file headers
    "TC001", "TC002", "TC003",  # pydantic resolves annotations at runtime;
                                # moving these into TYPE_CHECKING breaks models
    "PLC0415", # local imports are used deliberately to keep package boundaries acyclic
    "PLR0917", # same rationale as PLR0913, already ignored
    "DOC201", "DOC402", "DOC501",
]

[tool.ruff.lint.per-file-ignores]
# Reporting scripts exist to print; they are not library code.
"scripts/*.py" = ["T201", "EXE001"]
"tests/*" = [
    "ANN", "PLR2004", "SLF001", "INP001", "T201", "PT018", "PERF401",
    "S603", "S607", "BLE001", "FBT001", "FBT002", "ARG001", "ARG002",
    "ARG003", "ARG004", "ARG005",  # raising stubs must accept any signature
]
"src/cerl/cli.py" = ["T201", "B008", "UP007"]
# The pilot entry points are scripts: they print, and they read the OS for the
# memory measurements the run has to report.
"src/cerl_rl/pilot.py" = ["T201", "S603", "S607", "PLW1510"]
"src/cerl_rl/replay.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
