name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy --strict src tests/typing
      - name: Package boundaries
        run: uv run lint-imports
      - name: Tests with coverage
        run: uv run pytest -q --cov=cerl --cov-report=term
      - name: Frozen scenarios regenerate byte-exactly
        run: uv run pytest tests/determinism -q
      - name: Coverage gate on correctness-critical packages
        run: |
          uv run pytest -q --cov=cerl.core --cov=cerl.diff --cov=cerl.trace \
            --cov=cerl.verify --cov-fail-under=90 --cov-report=term
